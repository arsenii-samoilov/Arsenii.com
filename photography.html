  <style>
    /* ── Photography page overrides ── */
    body { background: #ffffff; }

    /* Cover */
    .photo-cover {
      text-align: center;
      padding: 4rem 2rem 2.5rem;
      max-width: 860px;
      margin: 0 auto;
    }
    .photo-cover-label {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .photo-cover h1 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 600;
      color: var(--text);
      margin: 0 0 1rem;
      line-height: 1.15;
    }

    /* Circle portrait inline with heading */
    .photo-cover-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 1rem;
    }
    .photo-cover-portrait {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 55%;
      box-shadow: 0 0 0 3px rgba(30,58,95,0.12), 0 0 0 5px rgba(185,28,28,0.06);
      flex-shrink: 0;
      overflow: hidden;
    }
    .photo-cover-title h1 { margin: 0; }
    .photo-cover p {
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 2rem;
    }

    /* Filter */
    .photo-controls {
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding: 0 1.5rem;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .filter-tag {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .filter-tag svg { width: 18px; height: 18px; pointer-events: none; }
    .filter-tag:hover,
    .filter-tag.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    /* Tooltip */
    .filter-tag::after {
      content: attr(data-label);
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,10,0.85);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .filter-tag:hover::after { opacity: 1; }

    /* Count */
    .photo-count {
      max-width: 1100px;
      margin: 0 auto 1.25rem;
      padding: 0 1.5rem;
      font-size: 0.825rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
    }

    /* Grid */
    .photo-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.6rem;
    }
    @media (max-width: 900px) {
      .photo-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .photo-item {
      cursor: pointer;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.08);
      position: relative;
      aspect-ratio: 1 / 1;
    }
    .photo-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease, opacity 0.2s;
    }
    .photo-item:hover img { transform: scale(1.06); }

    .photo-item-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      color: #fff;
      padding: 1.5rem 0.75rem 0.65rem;
      font-family: var(--font-sans);
      font-size: 0.775rem;
      line-height: 1.3;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .photo-item:hover .photo-item-caption { opacity: 1; }
    .photo-item-caption strong { display: block; font-size: 0.825rem; }

    .photo-item.hidden { display: none; }

    /* No results */
    .no-results {
      display: none;
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
    }

    /* Lightbox */
    .lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .lb.open { display: flex; }

    .lb-img-wrap {
      position: relative;
      max-width: min(90vw, 1100px);
      max-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-img-wrap img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    .lb-meta {
      position: absolute;
      bottom: -2.5rem;
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.75);
      font-family: var(--font-sans);
      font-size: 0.8rem;
    }

    .lb-close {
      position: fixed;
      top: 1.25rem; right: 1.5rem;
      background: none; border: none;
      color: #fff; font-size: 2rem;
      cursor: pointer; line-height: 1;
      opacity: 0.75; transition: opacity 0.2s;
      z-index: 10000;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-close:hover { opacity: 1; }

    .lb-share {
      position: fixed;
      top: 1.25rem; right: 4.5rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      z-index: 10000;
    }
    .lb-share:hover { background: rgba(255,255,255,0.25); }

    /* Toast notification */
    .share-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(1rem);
      background: rgba(10,10,10,0.88);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      padding: 0.6rem 1.25rem;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10001;
    }
    .share-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .lb-nav {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      z-index: 10000;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.25); }
    .lb-prev { left: 1rem; }
    .lb-next { right: 1rem; }

    @media (max-width: 768px) {
      .photo-controls { padding: 0 1rem; }
      .filter-tags { gap: 0.4rem; }
      .filter-tag { width: 44px; height: 44px; }
      .filter-tag svg { width: 17px; height: 17px; }
      .photo-count { padding: 0 1rem; }
      .photo-grid { padding: 0 1rem 3rem; gap: 0.45rem; }
    }
    @media (max-width: 600px) {
      .photo-cover { padding: 2.5rem 1.25rem 1.75rem; }
      .photo-cover h1 { font-size: clamp(1.75rem, 8vw, 2.5rem); }
      .photo-cover p { font-size: 0.85rem; }
      .photo-cover-portrait { width: 56px; height: 56px; }
      .filter-tag { width: 44px; height: 44px; }
      .filter-tag::after { display: none; } /* no tooltips on touch */
      .photo-item-caption { opacity: 1; background: linear-gradient(transparent, rgba(0,0,0,0.5)); padding: 1rem 0.6rem 0.5rem; }
      .lb-nav { display: none; }
      .lb-img-wrap { max-width: 96vw; max-height: 80vh; }
      .lb-img-wrap img { max-height: 80vh; }
      .lb-meta { font-size: 0.75rem; }
    }
  </style>
</head>

    /* ── State ── */
    let activeFilter = 'all';
    let lbIndex = 0;
    let visiblePhotos = [];

    /* ── Tone-aware arrangement ──
       First 5 photos are always pinned (top row stays static).
       The rest are randomly shuffled ONCE at page load, then
       tone-arranged so no two adjacent photos share the same tone.
       The shuffled order is cached in ARRANGED_PHOTOS and never
       re-randomized — filters/search operate on this stable order.
    */
    const COLS = 5;
    const PINNED = 5; // number of photos locked to the top row

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildArrangedOrder(photos) {
      if (photos.length === 0) return [];

      const pinned = photos.slice(0, Math.min(PINNED, photos.length));
      const rest   = shuffleArray(photos.slice(pinned.length));

      const buckets = {};
      rest.forEach(p => {
        const t = p.tone || 'light';
        (buckets[t] = buckets[t] || []).push(p);
      });

      const arranged = [];
      const toneKeys = Object.keys(buckets);
      const used = {};
      toneKeys.forEach(k => used[k] = 0);
      const total = rest.length;

      while (arranged.length < total) {
        const available = toneKeys.filter(k => used[k] < buckets[k].length);
        if (!available.length) break;

        const col = arranged.length % COLS;
        const leftTone  = col > 0 ? arranged[arranged.length - 1].tone : null;
        const aboveIdx  = arranged.length - COLS;
        const aboveTone = aboveIdx >= 0
          ? arranged[aboveIdx].tone
          : (pinned.length >= COLS ? pinned[pinned.length - COLS + (arranged.length % COLS)]?.tone : null);

        let preferred = available.filter(k => k !== leftTone && k !== aboveTone);
        if (!preferred.length) preferred = available.filter(k => k !== leftTone);
        if (!preferred.length) preferred = available;

        preferred.sort((a, b) => (buckets[b].length - used[b]) - (buckets[a].length - used[a]));
        const chosenTone = preferred[0];

        arranged.push(buckets[chosenTone][used[chosenTone]]);
        used[chosenTone]++;
      }

      return [...pinned, ...arranged];
    }

    // Build the display order once — stays fixed for the entire session.
    const ARRANGED_PHOTOS = buildArrangedOrder(PHOTOS);

    /* ── Render ── */
    function getVisible() {
      return ARRANGED_PHOTOS.filter(p =>
        activeFilter === 'all' || p.tags.includes(activeFilter)
      );
    }

    function renderGrid() {
      visiblePhotos = getVisible();
      const grid = document.getElementById('photoGrid');
      const noRes = document.getElementById('noResults');
      const count = document.getElementById('photoCount');

      grid.innerHTML = '';
      noRes.style.display = visiblePhotos.length === 0 ? 'block' : 'none';
      count.textContent = visiblePhotos.length === PHOTOS.length
        ? `${PHOTOS.length} photos`
        : `${visiblePhotos.length} of ${PHOTOS.length} photos`;

      visiblePhotos.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.dataset.index = i;
        div.innerHTML = `
          <img src="${p.src}" alt="${p.keywords ? p.keywords.split(' ').slice(0,5).join(' ') + ' — ' + p.title : p.title}" loading="${i < 9 ? 'eager' : 'lazy'}"${i === 0 ? ' fetchpriority="high"' : ''}>
          <div class="photo-item-caption"><strong>${p.title}</strong></div>
        `;
        div.addEventListener('click', () => openLb(i));
        grid.appendChild(div);
        // GA4
        div.addEventListener('click', () => {
          if (typeof gtag === 'function') gtag('event', 'photo_click', { event_category: 'Photography', event_label: p.title });
        });
      });
    }

    /* ── Lightbox ── */
    function openLb(i) {
      lbIndex = i;
      showLb();
      document.getElementById('lb').classList.add('open');
      if (typeof gtag === 'function') gtag('event', 'photo_view', { event_category: 'Photography', event_label: visiblePhotos[i]?.title });
    }

    function showLb() {
      const p = visiblePhotos[lbIndex];
      if (!p) return;
      document.getElementById('lbImg').src = p.src;
      document.getElementById('lbImg').alt = p.keywords ? p.keywords.split(' ').slice(0,5).join(' ') + ' — ' + p.title : p.title;
      document.getElementById('lbMeta').textContent = `${p.title}  ·  ${lbIndex + 1} / ${visiblePhotos.length}`;
    }

    function closeLb() {
      document.getElementById('lb').classList.remove('open');
    }

    document.getElementById('lbClose').addEventListener('click', closeLb);
    document.getElementById('lb').addEventListener('click', e => { if (e.target === e.currentTarget) closeLb(); });

    document.getElementById('lbPrev').addEventListener('click', e => {
      e.stopPropagation();
      lbIndex = (lbIndex - 1 + visiblePhotos.length) % visiblePhotos.length;
      showLb();
      if (typeof gtag === 'function') gtag('event', 'photo_navigate', { event_category: 'Photography', direction: 'prev' });
    });
    document.getElementById('lbNext').addEventListener('click', e => {
      e.stopPropagation();
      lbIndex = (lbIndex + 1) % visiblePhotos.length;
      showLb();
      if (typeof gtag === 'function') gtag('event', 'photo_navigate', { event_category: 'Photography', direction: 'next' });
    });

    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lb');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
      if (e.key === 'ArrowRight') document.getElementById('lbNext').click();
    });

    /* Touch swipe */
    let tsX = 0, tsY = 0;
    document.getElementById('lb').addEventListener('touchstart', e => {
      tsX = e.touches[0].clientX;
      tsY = e.touches[0].clientY;
    }, { passive: true });
    document.getElementById('lb').addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tsX;
      const dy = e.changedTouches[0].clientY - tsY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
        if (dx < 0) document.getElementById('lbNext').click();
        else document.getElementById('lbPrev').click();
      } else if (dy > 80 && Math.abs(dx) < 40) {
        closeLb();
      }
    }, { passive: true });

    /* ── Share ── */
    function showToast(msg) {
      const t = document.getElementById('shareToast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.getElementById('lbShare').addEventListener('click', async e => {
      e.stopPropagation();
      const p = visiblePhotos[lbIndex];
      if (!p) return;
      const url = `https://arsenii.com/photos/${p.src.split('/').pop()}`;
      const shareData = {
        title: `Photography — ${p.title}`,
        text: `${p.title} · Photography by Arsenii Samoilov`,
        url
      };
      if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
        try {
          await navigator.share(shareData);
          if (typeof gtag === 'function') gtag('event', 'photo_share', { event_category: 'Photography', event_label: p.title, method: 'native' });
        } catch (err) { /* user cancelled */ }
      } else {
        try {
          await navigator.clipboard.writeText(url);
          showToast('Link copied');
          if (typeof gtag === 'function') gtag('event', 'photo_share', { event_category: 'Photography', event_label: p.title, method: 'clipboard' });
        } catch {
          showToast('Copy: ' + url);
        }
      }
    });

    /* ── Filters ── */
    document.getElementById('filterTags').addEventListener('click', e => {
      const btn = e.target.closest('.filter-tag');
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-tag').forEach(b => b.classList.toggle('active', b === btn));
      renderGrid();
      if (typeof gtag === 'function') gtag('event', 'photo_filter', { event_category: 'Photography', event_label: activeFilter });
    });

    /* ── Init ── */
    renderGrid();
  </script>
