  <style>
    /* ── Photography page overrides ── */
    body { background: #ffffff; }

    /* Cover */
    .photo-cover {
      text-align: center;
      padding: 4rem 2rem 2.5rem;
      max-width: 860px;
      margin: 0 auto;
    }
    .photo-cover-label {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .photo-cover h1 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 600;
      color: var(--text);
      margin: 0 0 1rem;
      line-height: 1.15;
    }
    .photo-cover p {
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 2rem;
    }

    /* Search & filter */
    .photo-controls {
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding: 0 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .photo-search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .photo-search-wrap svg {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .photo-search {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .photo-search:focus { border-color: #0a0a0a; }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .filter-tag {
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.825rem;
      font-family: var(--font-sans);
      color: var(--text-muted);
      background: #fff;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .filter-tag:hover,
    .filter-tag.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* Count */
    .photo-count {
      max-width: 1100px;
      margin: 0 auto 1.25rem;
      padding: 0 1.5rem;
      font-size: 0.825rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
    }

    /* Grid */
    .photo-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.6rem;
    }
    @media (max-width: 900px) {
      .photo-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .photo-item {
      cursor: pointer;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.08);
      position: relative;
      aspect-ratio: 1 / 1;
    }
    .photo-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease, opacity 0.2s;
    }
    .photo-item:hover img { transform: scale(1.06); }

    .photo-item-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      color: #fff;
      padding: 1.5rem 0.75rem 0.65rem;
      font-family: var(--font-sans);
      font-size: 0.775rem;
      line-height: 1.3;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .photo-item:hover .photo-item-caption { opacity: 1; }
    .photo-item-caption strong { display: block; font-size: 0.825rem; }

    .photo-item.hidden { display: none; }

    /* No results */
    .no-results {
      display: none;
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
    }

    /* Lightbox */
    .lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .lb.open { display: flex; }

    .lb-img-wrap {
      position: relative;
      max-width: min(90vw, 1100px);
      max-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-img-wrap img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    .lb-meta {
      position: absolute;
      bottom: -2.5rem;
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.75);
      font-family: var(--font-sans);
      font-size: 0.8rem;
    }

    .lb-close {
      position: fixed;
      top: 1.25rem; right: 1.5rem;
      background: none; border: none;
      color: #fff; font-size: 2rem;
      cursor: pointer; line-height: 1;
      opacity: 0.75; transition: opacity 0.2s;
      z-index: 10000;
    }
    .lb-close:hover { opacity: 1; }

    .lb-nav {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      z-index: 10000;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.25); }
    .lb-prev { left: 1rem; }
    .lb-next { right: 1rem; }

    @media (max-width: 600px) {
      .photo-cover { padding: 2.5rem 1.25rem 1.75rem; }
      .lb-nav { display: none; }
    }
  </style>
</head>

    /* ── State ── */
    let activeFilter = 'all';
    let activeSearch = '';
    let lbIndex = 0;
    let visiblePhotos = [];

    /* ── Tone-aware arrangement ──
       First 5 photos are always pinned (top row stays static).
       The rest are randomly shuffled on each page load, then
       tone-arranged so no two adjacent photos share the same tone.
    */
    const COLS = 5;
    const PINNED = 5; // number of photos locked to the top row

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function arrangeTones(photos) {
      if (photos.length === 0) return [];

      // Split: keep first PINNED locked, shuffle the rest
      const pinned = photos.slice(0, Math.min(PINNED, photos.length));
      const rest   = shuffleArray(photos.slice(pinned.length));

      // Group rest by tone
      const buckets = {};
      rest.forEach(p => {
        const t = p.tone || 'light';
        (buckets[t] = buckets[t] || []).push(p);
      });

      // Build tone-aware order for the rest, row-by-row (5 cols)
      const arranged = [];
      const toneKeys = Object.keys(buckets);
      const used = {};
      toneKeys.forEach(k => used[k] = 0);
      const total = rest.length;

      // Seed context from the last row of pinned photos so the
      // first shuffled row doesn't clash with the pinned row above it.
      while (arranged.length < total) {
        const available = toneKeys.filter(k => used[k] < buckets[k].length);
        if (!available.length) break;

        const col = arranged.length % COLS;
        const leftTone  = col > 0 ? arranged[arranged.length - 1].tone : null;
        // Above: either within arranged block, or last row of pinned
        const aboveIdx  = arranged.length - COLS;
        const aboveTone = aboveIdx >= 0
          ? arranged[aboveIdx].tone
          : (pinned.length >= COLS ? pinned[pinned.length - COLS + (arranged.length % COLS)]?.tone : null);

        let preferred = available.filter(k => k !== leftTone && k !== aboveTone);
        if (!preferred.length) preferred = available.filter(k => k !== leftTone);
        if (!preferred.length) preferred = available;

        preferred.sort((a, b) => (buckets[b].length - used[b]) - (buckets[a].length - used[a]));
        const chosenTone = preferred[0];

        arranged.push(buckets[chosenTone][used[chosenTone]]);
        used[chosenTone]++;
      }

      return [...pinned, ...arranged];
    }

    /* ── Render ── */
    function getVisible() {
      const q = activeSearch.toLowerCase();
      return PHOTOS.filter(p => {
        const filterMatch = activeFilter === 'all' || p.tags.includes(activeFilter);
        const searchMatch = !q || p.title.toLowerCase().includes(q) || p.keywords.toLowerCase().includes(q) || p.tags.some(t => t.includes(q));
        return filterMatch && searchMatch;
      });
    }

    function renderGrid() {
      const raw = getVisible();
      visiblePhotos = arrangeTones(raw);
      const grid = document.getElementById('photoGrid');
      const noRes = document.getElementById('noResults');
      const count = document.getElementById('photoCount');

      grid.innerHTML = '';
      noRes.style.display = visiblePhotos.length === 0 ? 'block' : 'none';
      count.textContent = visiblePhotos.length === PHOTOS.length
        ? `${PHOTOS.length} photos`
        : `${visiblePhotos.length} of ${PHOTOS.length} photos`;

      visiblePhotos.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.dataset.index = i;
        div.innerHTML = `
          <img src="${p.src}" alt="${p.title}" loading="${i < 9 ? 'eager' : 'lazy'}"${i === 0 ? ' fetchpriority="high"' : ''}>
          <div class="photo-item-caption"><strong>${p.title}</strong></div>
        `;
        div.addEventListener('click', () => openLb(i));
        grid.appendChild(div);
        // GA4
        div.addEventListener('click', () => {
          if (typeof gtag === 'function') gtag('event', 'photo_click', { event_category: 'Photography', event_label: p.title });
        });
      });
    }

    /* ── Lightbox ── */
    function openLb(i) {
      lbIndex = i;
      showLb();
      document.getElementById('lb').classList.add('open');
      if (typeof gtag === 'function') gtag('event', 'photo_view', { event_category: 'Photography', event_label: visiblePhotos[i]?.title });
    }

    function showLb() {
      const p = visiblePhotos[lbIndex];
      if (!p) return;
      document.getElementById('lbImg').src = p.src;
      document.getElementById('lbImg').alt = p.title;
      document.getElementById('lbMeta').textContent = `${p.title}  ·  ${lbIndex + 1} / ${visiblePhotos.length}`;
    }

    function closeLb() {
      document.getElementById('lb').classList.remove('open');
    }

    document.getElementById('lbClose').addEventListener('click', closeLb);
    document.getElementById('lb').addEventListener('click', e => { if (e.target === e.currentTarget) closeLb(); });

    document.getElementById('lbPrev').addEventListener('click', e => {
      e.stopPropagation();
      lbIndex = (lbIndex - 1 + visiblePhotos.length) % visiblePhotos.length;
      showLb();
      if (typeof gtag === 'function') gtag('event', 'photo_navigate', { event_category: 'Photography', direction: 'prev' });
    });
    document.getElementById('lbNext').addEventListener('click', e => {
      e.stopPropagation();
      lbIndex = (lbIndex + 1) % visiblePhotos.length;
      showLb();
      if (typeof gtag === 'function') gtag('event', 'photo_navigate', { event_category: 'Photography', direction: 'next' });
    });

    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lb');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
      if (e.key === 'ArrowRight') document.getElementById('lbNext').click();
    });

    /* Touch swipe */
    let tsX = 0, tsY = 0;
    document.getElementById('lb').addEventListener('touchstart', e => {
      tsX = e.touches[0].clientX;
      tsY = e.touches[0].clientY;
    }, { passive: true });
    document.getElementById('lb').addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tsX;
      const dy = e.changedTouches[0].clientY - tsY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
        if (dx < 0) document.getElementById('lbNext').click();
        else document.getElementById('lbPrev').click();
      } else if (dy > 80 && Math.abs(dx) < 40) {
        closeLb();
      }
    }, { passive: true });

    /* ── Filters ── */
    document.getElementById('filterTags').addEventListener('click', e => {
      const btn = e.target.closest('.filter-tag');
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-tag').forEach(b => b.classList.toggle('active', b === btn));
      renderGrid();
      if (typeof gtag === 'function') gtag('event', 'photo_filter', { event_category: 'Photography', event_label: activeFilter });
    });

    /* ── Search ── */
    document.getElementById('photoSearch').addEventListener('input', e => {
      activeSearch = e.target.value;
      renderGrid();
    });

    /* ── Init ── */
    renderGrid();
  </script>
