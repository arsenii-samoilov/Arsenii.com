name: Deploy to arsenii.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-arsenii-com
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SSH_PRIVATE_KEY secret is missing. Add it at:"
            echo "https://github.com/arsenii-samoilov/Arsenii.com/settings/secrets/actions"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H arsenii.com >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key root@arsenii.com \
            'cd /var/www/html && git fetch origin main && git reset --hard origin/main && echo "Deployed at $(date -u)"'
