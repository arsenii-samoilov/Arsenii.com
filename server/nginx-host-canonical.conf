# Apex hostname only (www and any non-apex Host header)
if ($http_host$request_uri ~* ^www\.arsenii\.com/index\.html?$) { return 301 https://arsenii.com/; }
if ($http_host$request_uri ~* ^www\.arsenii\.com/tools/index\.html?$) { return 301 https://arsenii.com/tools/; }
if ($http_host$request_uri ~* ^www\.arsenii\.com/pricing(\.html)?$) { return 410; }
if ($http_host !~* ^arsenii\.com$) {
    return 301 https://arsenii.com$request_uri;
}
