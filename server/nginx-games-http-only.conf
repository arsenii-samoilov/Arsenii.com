# Temporary HTTP-only config while certbot provisions the SSL cert
server {
    listen 80;
    listen [::]:80;
    server_name games.arsenii.com;

    root /var/www/html/games;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
