# Production nginx config for arsenii.com (deploy to /etc/nginx/sites-available/default)
# Handles: HTTP/HTTPS, www→apex, IP→apex, extensionless paths, insights/ trap, index.html→/

# HTTP: named hosts → HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name arsenii.com www.arsenii.com;
    return 301 https://arsenii.com$request_uri;
}

# HTTP: IP and unknown hosts → HTTPS apex
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://arsenii.com$request_uri;
}

# HTTPS: IP and unknown hosts → apex
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/arsenii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arsenii.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://arsenii.com$request_uri;
}

# HTTPS: primary site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arsenii.com www.arsenii.com;

    root /var/www/html;
    index index.html index.htm;

    ssl_certificate /etc/letsencrypt/live/arsenii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arsenii.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/security-headers.conf;

    include /etc/nginx/snippets/arsenii-host-canonical.conf;
    include /etc/nginx/snippets/arsenii-path-redirects.conf;

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
