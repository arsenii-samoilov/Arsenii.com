# games.arsenii.com — AREA FIFTY FIVE game
# Deploy to: /etc/nginx/sites-available/games.arsenii.com
# Then: ln -sf /etc/nginx/sites-available/games.arsenii.com /etc/nginx/sites-enabled/games.arsenii.com
# SSL:  certbot --nginx -d games.arsenii.com

server {
    listen 80;
    listen [::]:80;
    server_name games.arsenii.com;
    return 301 https://games.arsenii.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name games.arsenii.com;

    root /var/www/html/games;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/games.arsenii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.arsenii.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip — compresses index.html from ~419 KB to ~90 KB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/html text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # Game HTML — short cache so updates go live fast
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # GLB models and other binary assets — cache aggressively (content-addressed)
    location ~* \.(glb|gltf|bin)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SVG, images
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
