# games.arsenii.com — static game hosting
# Deploy to: /etc/nginx/sites-available/games.arsenii.com
# Then: ln -s /etc/nginx/sites-available/games.arsenii.com /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d games.arsenii.com

server {
    listen 80;
    listen [::]:80;
    server_name games.arsenii.com;
    return 301 https://games.arsenii.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name games.arsenii.com;

    root /var/www/html/games;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/games.arsenii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.arsenii.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/security-headers.conf;

    # Game assets — allow large files, cache aggressively
    location ~* \.(js|css|html|svg|png|jpg|jpeg|gif|webp|ico|glb|gltf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
